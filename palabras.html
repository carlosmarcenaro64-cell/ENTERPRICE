<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diccionario - Palabra Secreta</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Archivo de Estilos Externo Separado -->
    <link rel="stylesheet" href="estilo.css">
</head>
<body class="bg-gradient-to-br from-indigo-950 via-purple-950 to-slate-950 min-h-screen text-white flex flex-col justify-between items-center p-4 select-none">

    <header class="w-full max-w-md flex items-center justify-between py-2 border-b border-white/10 mb-4">
        <a href="index.html" class="bg-white/15 hover:bg-white/25 active:scale-95 text-white font-bold px-3 py-2 rounded-xl text-xs flex items-center gap-1 transition-all no-underline">
            ⬅️ Volver al Juego
        </a>
        <h1 class="text-lg font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-teal-400 to-emerald-300">
            📖 Diccionario
        </h1>
    </header>

    <main class="w-full max-w-md flex flex-col flex-1 gap-3">
        <p class="text-xs text-teal-200/80 text-center">
            Explora las palabras disponibles en el juego. Introduce el PIN secreto para ver descripciones completas.
        </p>

        <div id="dic-unlock-container" class="flex gap-2 bg-slate-900/80 p-3 rounded-2xl border border-teal-500/30 shadow-lg">
            <input type="password" id="dic-pin" placeholder="PIN secreto..." class="flex-1 bg-white/10 border border-white/20 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-teal-400 text-center tracking-widest font-bold">
            <button id="dic-unlock-btn" class="bg-teal-600 hover:bg-teal-500 active:scale-95 text-white text-xs font-bold px-5 py-2 rounded-xl transition-all shadow-md">Desbloquear</button>
        </div>

        <div id="words-list-container" class="overflow-y-auto pr-1 space-y-3 flex-1 custom-scrollbar max-h-[65vh]">
            <!-- Listado dinámico de palabras -->
        </div>
    </main>

    <footer class="w-full max-w-md flex items-center justify-center text-[11px] text-indigo-300/80 pt-3 border-t border-white/10 mt-4">
        <span class="font-bold tracking-wide">By: <span class="text-pink-400">Marcenaroc64</span></span>
    </footer>

    <script>
        const rawData = [
            "SOL|Astro|Astro diurno","PAN|Alimento|Hecho de harina","LUZ|Claridad|Vence a las sombras","MAR|Agua|Masa de agua salada","REY|Monarca|Soberano de un reino","VOZ|Sonido|Producido por cuerdas vocales","ORO|Metal|Metal precioso amarillo","RIO|Cauce|Corriente natural de agua","PAZ|Tranquilidad|Estado sin conflictos","RED|Malla|Malla de hilos","OLA|Onda|Onda en el agua","SUR|Punto|Punto cardinal","AJO|Planta|Bulbo usado en cocina","DIA|Periodo|Iluminado por el sol","GAS|Estado|Estado fluido de la materia","LEY|Norma|Regla establecida","BAR|Local|Para tomar bebidas","BUS|Transporte|Vehículo urbano","UVA|Fruta|Para hacer vino","COL|Hortaliza|Hojas apretadas","PIE|Extremidad|Base para caminar","SAL|Condimento|Sustancia blanca","VIA|Camino|Carril de tránsito","OJO|Órgano|Órgano visual","REO|Acusado|Persona juzgada","DOS|Número|Después del uno","SIN|Preposición|Carencia de algo","CON|Preposición|Compañía de algo","POR|Preposición|Causa o motivo","QUE|Pronombre|Pronombre relativo","TAL|Adjetivo|Semejante o igual","VER|Verbo|Percibir por los ojos","DAR|Verbo|Entregar algo","SER|Verbo|Tener existencia","FIN|Término|Final de algo","MAL|Daño|Lo contrario al bien","MES|Tiempo|Doceava parte del año","ECO|Sonido|Reflejo de sonido","EGO|Psicología|Conciencia del yo","IRA|Emoción|Enojo profundo","TIO|Familiar|Hermano del padre","TIA|Familiar|Hermana de la madre","OSO|Animal|Mamífero peludo","RON|Bebida|Licor de caña","TOS|Reflejo|Expulsión de aire","USO|Acción|Acción de usar","UNO|Número|El primer número",
            "CASA|Vivienda|Lugar donde se habita","LUNA|Satélite|Satélite natural de la Tierra","AGUA|Líquido|Vital para la vida","ROSA|Flor|Flor con espinas","ARCO|Arma|Para disparar flechas","CAFE|Bebida|Estimulante oscuro","LAPIZ|Utensilio|Para escribir en papel","LEON|Animal|Rey de la selva","PATO|Ave|Ave acuática","ROJO|Color|Color primario cálido","AZUL|Color|Color del cielo despejado","OSO|Animal|Mamífero grande","GATO|Animal|Felino doméstico","PERO|Conjunción|Conjunción adversativa","TAPA|Cubierta|Cierre de un recipiente","ROCA|Piedra|Fragmento mineral duro","VIDA|Existencia|Estado de los seres vivos","AIRE|Gas|Mezcla de gases atmosféricos","NUBE|Vapor|Acumulación de vapor suspendido","FUEGO|Calor|Proceso de combustión","HIEL|Líquido|Bilis segregada por el hígado","MARS|Planeta|Planeta rojo","LOLA|Nombre|Nombre propio femenino","BOTE|Embarcación|Embarcación pequeña","PIPA|Pipa|Para fumar tabaco","MESA|Mueble|Mueble con tablero y patas","SILL|Mueble|Asiento con respaldo","TREN|Vehículo|Transporte ferroviario","NAVE|Vehículo|Para navegar en el espacio","COCO|Fruta|Fruto de la palmera",
            "PERRO|Animal|El mejor amigo del hombre","GABAN|Prenda|Abrigo largo con mangas","PLAYA|Costa|Arena junto al mar","LIBRO|Objeto|Conjunto de hojas encuadernadas","FUTBOL|Deporte|Deporte rey con balón","PIANO|Instrumento|Instrumento musical de teclas","TIGRE|Animal|Felino rayado de Asia","VALLE|Terreno|Llanura entre montañas","ARBOL|Planta|Planta con tronco leñoso","RADIO|Aparato|Para escuchar transmisiones","MOTOR|Máquina|Que produce movimiento","PLATO|Utensilio|Recipiente para comer","RELOJ|Objeto|Mide el paso del tiempo","MAGIA|Arte|Producción de efectos ilusorios","TORRE|Construcción|Edificio alto y estrecho",
            "PLANETA|Cuerpo|Cuerpo celeste en órbita","MUSICA|Arte|Combinación de sonidos","TIERRA|Planeta|Nuestro hogar en el espacio","OCEANO|Agua|Gran masa de agua salada","CIELOS|Espacio|Bóveda celeste visible",
            "LIBERTAD|Derecho|Facultad natural de obrar","ESTRELLA|Astro|Cuerpo celeste que brilla con luz propia","DIAMANTE|Mineral|Piedra preciosa cristalina",
            "ASTRONAUTA|Profesión|Explorador del espacio exterior","UNIVERSO|Todo|La totalidad del espacio y el tiempo"
        ];

        const dictionary = rawData.map(item => {
            const parts = item.split('|');
            return { word: parts[0].toUpperCase(), hint: parts[1] || 'Sin pista', long: parts[2] || 'Sin descripción' };
        });

        let unlocked = false;

        function renderList() {
            const container = document.getElementById('words-list-container');
            container.innerHTML = '';
            dictionary.forEach(item => {
                const div = document.createElement('div');
                div.className = 'bg-white/5 border border-white/10 rounded-xl p-3 flex flex-col gap-1 transition-all hover:bg-white/10';
                
                const header = document.createElement('div');
                header.className = 'flex justify-between items-center';
                
                const wSpan = document.createElement('span');
                wSpan.className = 'font-black text-teal-300 text-sm tracking-wider';
                wSpan.textContent = unlocked ? item.word : `${item.word[0]}*** (${item.word.length} letras)`;
                
                const badge = document.createElement('span');
                badge.className = 'text-[10px] bg-teal-950 text-teal-200 px-2 py-0.5 rounded-full border border-teal-500/30 font-semibold';
                badge.textContent = `${item.word.length} letras`;
                
                header.appendChild(wSpan);
                header.appendChild(badge);
                div.appendChild(header);

                const hintP = document.createElement('p');
                hintP.className = 'text-xs text-slate-300 italic';
                hintP.textContent = `Pista: ${item.hint}`;
                div.appendChild(hintP);

                if (unlocked) {
                    const longP = document.createElement('p');
                    longP.className = 'text-[11px] text-teal-100/90 mt-1 pt-1 border-t border-white/5';
                    longP.textContent = `Desc: ${item.long}`;
                    div.appendChild(longP);
                }

                container.appendChild(div);
            });
        }

        document.getElementById('dic-unlock-btn').addEventListener('click', () => {
            const pin = document.getElementById('dic-pin').value;
            if (pin === "6464" || pin === "2026" || pin === "1234") {
                unlocked = true;
                document.getElementById('dic-unlock-container').classList.add('hidden');
                renderList();
            } else {
                alert("PIN incorrecto");
            }
        });

        window.addEventListener('load', renderList);
    </script>
</body>
</html>
