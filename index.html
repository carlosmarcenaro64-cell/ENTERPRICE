<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Recibos Enterprice</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧾</text></svg>">
    
    <style>
        /* ESTILOS DE BASE */
        :root { --bg-dark: #0a0e17; --primary-cyan: #64dded; --accent-blue: #3b8d99; --text-primary: #e0f2f7; --danger-red: #ff4757; --success-green: #2ed573; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0e17; color: var(--text-primary); margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        
        .container { max-width: 500px; width: 100%; background: rgba(20, 30, 48, 0.9); padding: 30px; border-radius: 20px; border: 1px solid rgba(100, 221, 237, 0.3); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { text-align: center; font-weight: 300; } .neon-text { color: var(--primary-cyan); font-weight: 700; }
        
        input[type="text"] { width: 100%; padding: 15px; border-radius: 10px; border: 2px solid #3b8d99; background: #1a2a3a; color: white; text-align: center; font-size: 1.1em; margin-bottom: 20px; box-sizing: border-box; }
        .btn-neon { width: 100%; padding: 15px; background: linear-gradient(90deg, #3b8d99, #64dded); border: none; border-radius: 10px; font-weight: bold; cursor: pointer; color: #000; }
        
        /* BANNER DE ESTADO */
        .status-banner { text-align: center; padding: 15px; margin: 20px 0; border-radius: 8px; font-weight: 800; font-size: 1.2em; text-transform: uppercase; letter-spacing: 2px; }
        .status-pagada { background: rgba(46, 213, 115, 0.2); color: var(--success-green); border: 2px solid var(--success-green); box-shadow: 0 0 15px rgba(46, 213, 115, 0.3); }
        .status-no-pagada { background: rgba(255, 71, 87, 0.2); color: var(--danger-red); border: 2px solid var(--danger-red); }

        /* TABLA */
        .recibo-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .recibo-table th { text-align: left; color: #a5c3d4; padding: 10px; }
        .recibo-table td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        
        /* TOTALES */
        .total-row td { font-size: 1.3em; font-weight: bold; padding-top: 20px; border-top: 2px solid white; }
        .text-green { color: var(--success-green); } .text-red { color: var(--danger-red); }

        /* FECHAS */
        .dates-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; text-align: center; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px; margin-bottom: 20px; }
        .date-item h4 { margin: 0; font-size: 0.7em; color: #aaa; } .date-item p { margin: 5px 0 0 0; font-weight: bold; }

        .hidden { display: none; }
        .error-msg { color: var(--danger-red); text-align: center; margin-top: 10px; }
        .paid-img { position: absolute; width: 200px; opacity: 0.8; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-20deg); pointer-events: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Consulta <span class="neon-text">Enterprice</span></h1>
        
        <input type="text" id="telefono" placeholder="Ingresa tu número (Ej: 98765432)">
        <button class="btn-neon" onclick="buscar()">BUSCAR RECIBO</button>
        <p id="error" class="error-msg"></p>

        <div id="resultado" class="hidden" style="position: relative;">
            <img id="sello-pagado" src="https://i.imgur.com/K711e1r.png" class="paid-img hidden">
            
            <h2 id="cliente" style="text-align: center; color: var(--primary-cyan);"></h2>
            
            <div id="banner-estado" class="status-banner"></div>

            <div class="dates-grid">
                <div class="date-item"><h4>F. CORTE</h4><p id="f-corte"></p></div>
                <div class="date-item"><h4>F. PAGO</h4><p id="f-pago" style="color: var(--primary-cyan)"></p></div>
                <div class="date-item"><h4>F. MORA</h4><p id="f-mora" style="color: var(--danger-red)"></p></div>
            </div>

            <table class="recibo-table">
                <thead><tr><th>Servicio</th><th>Total</th></tr></thead>
                <tbody id="lista-servicios"></tbody>
                <tfoot>
                    <tr class="total-row">
                        <td>TOTAL:</td>
                        <td id="total-monto"></td>
                    </tr>
                </tfoot>
            </table>

            <div style="text-align: center; margin-top: 30px; padding: 15px; border: 1px dashed #3b8d99; border-radius: 10px;">
                <p style="margin:0; color: #aaa; font-size: 0.8em;">DATOS DE PAGO</p>
                <p style="margin:5px 0; font-weight:bold;">CARLOS PANAMEÑO</p>
                <p style="margin:0;">Bancoagrícola: 3113009677</p>
            </div>
        </div>
    </div>

    <script>
        // PEGA TU URL DE APPS SCRIPT AQUÍ
        const API_URL = "https://script.google.com/macros/s/AKfycbyv_Yj9_Z5HfRn6dZ1cb65-CAf4T4ggmoIDmg4iUlz9Sz6tWVfcBszBo9bPnwImOdP-6Q/exec";

        function buscar() {
            const tel = document.getElementById('telefono').value.trim();
            const error = document.getElementById('error');
            const res = document.getElementById('resultado');
            
            if(!tel) { error.textContent = "Escribe un número."; return; }
            
            error.textContent = "Buscando...";
            res.classList.add('hidden');

            fetch(API_URL)
                .then(r => r.json())
                .then(data => {
                    const cliente = data[tel];
                    if(!cliente) {
                        error.textContent = "Número no encontrado.";
                        return;
                    }
                    error.textContent = "";
                    mostrarRecibo(cliente);
                })
                .catch(e => {
                    console.log(e);
                    error.textContent = "Error de conexión. Intenta de nuevo.";
                });
        }

        function mostrarRecibo(c) {
            document.getElementById('resultado').classList.remove('hidden');
            document.getElementById('cliente').textContent = c.nombre;
            document.getElementById('f-corte').textContent = c.fechaCorte;
            document.getElementById('f-pago').textContent = c.fechaLimite;
            document.getElementById('f-mora').textContent = c.fechaMora;

            // Lógica de Estado
            const banner = document.getElementById('banner-estado');
            const sello = document.getElementById('sello-pagado');
            const totalDisplay = document.getElementById('total-monto');
            
            // Calculamos el total real
            let totalReal = c.totalServicios + c.pendienteAnterior;

            if (c.pagado === true) {
                // CASO 1: PAGADO
                banner.textContent = "PAGADA";
                banner.className = "status-banner status-pagada";
                sello.classList.remove('hidden'); // Mostrar sello
                totalDisplay.textContent = "$0.00"; // Deuda en cero
                totalDisplay.className = "text-green";
            } else {
                // CASO 2: NO PAGADO
                banner.textContent = "NO PAGADA";
                banner.className = "status-banner status-no-pagada";
                sello.classList.add('hidden'); // Ocultar sello
                totalDisplay.textContent = "$" + totalReal.toFixed(2);
                totalDisplay.className = "text-red";
            }

            // Llenar tabla
            const tbody = document.getElementById('lista-servicios');
            tbody.innerHTML = "";
            c.servicios.forEach(s => {
                tbody.innerHTML += `<tr><td>${s.servicio}</td><td>$${s.total.toFixed(2)}</td></tr>`;
            });
            if(c.pendienteAnterior > 0) {
                 tbody.innerHTML += `<tr><td>Deuda Anterior</td><td>$${c.pendienteAnterior.toFixed(2)}</td></tr>`;
            }
        }
    </script>
</body>
</html>
