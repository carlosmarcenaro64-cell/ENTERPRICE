<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Recibos Enterprice</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧾</text></svg>">
    
    <style>
        :root { --bg-dark: #0a0e17; --primary-cyan: #64dded; --accent-blue: #3b8d99; --text-primary: #e0f2f7; --danger-red: #ff4757; --success-green: #2ed573; --bg-panel: rgba(20, 30, 48, 0.95); }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: radial-gradient(circle at top right, #1a2a3a 0%, #0a0e17 100%); color: var(--text-primary); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .container { max-width: 500px; width: 100%; background: var(--bg-panel); padding: 30px; border-radius: 20px; border: 1px solid rgba(100,221,237,0.3); box-shadow: 0 20px 50px rgba(0,0,0,0.5); position: relative; overflow: hidden; }
        
        h1 { text-align: center; font-weight: 300; margin-bottom: 5px; } 
        .neon-text { color: var(--primary-cyan); font-weight: 800; text-shadow: 0 0 10px rgba(100,221,237,0.5); }
        .subtitle { text-align: center; color: #a5c3d4; font-size: 0.9em; margin-bottom: 25px; }

        input[type="text"] { width: 100%; padding: 15px; border-radius: 12px; border: 2px solid #3b506b; background: rgba(0,0,0,0.2); color: white; text-align: center; font-size: 1.2em; margin-bottom: 20px; box-sizing: border-box; outline: none; transition: 0.3s; }
        input[type="text"]:focus { border-color: var(--primary-cyan); background: rgba(0,0,0,0.4); }

        .btn-neon { width: 100%; padding: 15px; background: linear-gradient(90deg, #3b8d99, #64dded); border: none; border-radius: 12px; font-weight: 800; letter-spacing: 1px; cursor: pointer; color: #0a0e17; transition: transform 0.2s; }
        .btn-neon:active { transform: scale(0.98); }

        /* ESTADO */
        .status-banner { text-align: center; padding: 12px; margin: 20px 0; border-radius: 8px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; font-size: 1.2em; }
        .status-pagada { background: rgba(46, 213, 115, 0.2); color: var(--success-green); border: 2px solid var(--success-green); box-shadow: 0 0 15px rgba(46, 213, 115, 0.2); }
        .status-no-pagada { background: rgba(255, 71, 87, 0.2); color: var(--danger-red); border: 2px solid var(--danger-red); animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.8; } }

        /* FECHAS */
        .dates-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; text-align: center; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; margin-bottom: 20px; }
        .date-item h4 { margin: 0; font-size: 0.65em; color: #8899a6; text-transform: uppercase; } 
        .date-item p { margin: 3px 0 0 0; font-weight: 700; font-size: 0.9em; }

        /* TABLA */
        .table-responsive { overflow-x: auto; }
        .recibo-table { width: 100%; border-collapse: separate; border-spacing: 0 5px; }
        .recibo-table th { text-align: left; color: #8899a6; font-size: 0.8em; padding: 5px 10px; }
        .recibo-table td { background: rgba(255,255,255,0.03); padding: 10px; border-radius: 6px; }
        .text-right { text-align: right; }

        /* TOTALES */
        .total-section td { background: transparent; padding-top: 5px; font-weight: bold; }
        .abono-row td { color: var(--success-green); }
        .final-row td { font-size: 1.3em; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 15px; }
        
        .paid-img { position: absolute; width: 220px; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-20deg); pointer-events: none; opacity: 0; transition: 0.5s; z-index: 10; }
        .show-stamp { opacity: 0.9; transform: translate(-50%, -50%) rotate(-20deg) scale(1); }

        .hidden { display: none; }
        .bank-info { margin-top: 25px; text-align: center; padding: 15px; border: 1px dashed #3b506b; border-radius: 10px; font-size: 0.9em; color: #a5c3d4; }
        .copy-btn { background: none; border: 1px solid var(--primary-cyan); color: var(--primary-cyan); padding: 5px 15px; border-radius: 20px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Consulta <span class="neon-text">Enterprice</span></h1>
        <p class="subtitle">v0.6.0 (Logic: Zero Balance)</p>
        
        <input type="text" id="telefono" placeholder="Número (Ej: 98765432)" autocomplete="off">
        <button class="btn-neon" onclick="buscar()">CONSULTAR</button>
        <p id="error-msg" style="color: var(--danger-red); text-align: center; min-height: 20px;"></p>

        <div id="resultado" class="hidden">
            <img id="sello" src="https://i.imgur.com/K711e1r.png" class="paid-img">

            <h2 id="cliente-nombre" style="text-align: center; color: var(--primary-cyan); margin-top: 0;"></h2>
            
            <div id="banner" class="status-banner"></div>

            <div class="dates-grid">
                <div class="date-item"><h4>Corte</h4><p id="f-corte"></p></div>
                <div class="date-item"><h4>Pago</h4><p id="f-pago" style="color: var(--primary-cyan)"></p></div>
                <div class="date-item"><h4>Mora</h4><p id="f-mora" style="color: var(--danger-red)"></p></div>
            </div>

            <div class="table-responsive">
                <table class="recibo-table">
                    <thead><tr><th>Servicio</th><th class="text-right">Total</th></tr></thead>
                    <tbody id="tabla-body"></tbody>
                    <tfoot class="total-section">
                        <tr>
                            <td class="text-right">Subtotal:</td>
                            <td class="text-right" id="val-subtotal"></td>
                        </tr>
                        <tr>
                            <td class="text-right">Deuda Ant.:</td>
                            <td class="text-right" id="val-mora"></td>
                        </tr>
                        <tr class="abono-row">
                            <td class="text-right">(-) Abonos:</td>
                            <td class="text-right" id="val-abono"></td>
                        </tr>
                        <tr class="final-row">
                            <td class="text-right" id="lbl-total">TOTAL:</td>
                            <td class="text-right" id="val-total"></td>
                        </tr>
                    </tfoot>
                </table>
            </div>

            <div class="bank-info">
                <strong>CARLOS PANAMEÑO</strong><br>
                Bancoagrícola: 3113009677<br>
                <button class="copy-btn" onclick="copiar()">Copiar Cuenta</button>
            </div>
        </div>
    </div>

    <script>
        // PEGA AQUÍ TU URL DE APPS SCRIPT
        const API_URL = "https://script.google.com/macros/s/AKfycbyv_Yj9_Z5HfRn6dZ1cb65-CAf4T4ggmoIDmg4iUlz9Sz6tWVfcBszBo9bPnwImOdP-6Q/exec";

        function buscar() {
            const tel = document.getElementById('telefono').value.trim();
            const error = document.getElementById('error-msg');
            const res = document.getElementById('resultado');

            if(!tel) { error.textContent = "Ingresa un número."; return; }
            
            error.textContent = "Buscando en la base de datos...";
            res.classList.add('hidden');

            fetch(API_URL)
            .then(r => r.json())
            .then(data => {
                const c = data[tel];
                if(c) {
                    error.textContent = "";
                    render(c);
                } else {
                    error.textContent = "Cliente no encontrado.";
                }
            })
            .catch(e => {
                console.error(e);
                error.textContent = "Error de conexión.";
            });
        }

        function render(c) {
            document.getElementById('resultado').classList.remove('hidden');
            document.getElementById('cliente-nombre').textContent = c.nombre;
            
            // Fechas
            document.getElementById('f-corte').textContent = c.fechaCorte;
            document.getElementById('f-pago').textContent = c.fechaLimite;
            document.getElementById('f-mora').textContent = c.fechaMora;

            // Lógica de ESTADO (Basada en matemáticas)
            const isPaid = c.pagado; // El script ya calculó si (Total - Abono <= 0)
            const banner = document.getElementById('banner');
            const sello = document.getElementById('sello');
            const lblTotal = document.getElementById('lbl-total');

            if(isPaid) {
                banner.textContent = "PAGADA";
                banner.className = "status-banner status-pagada";
                sello.classList.add('show-stamp');
                lblTotal.textContent = "SALDO:";
            } else {
                banner.textContent = "NO PAGADA";
                banner.className = "status-banner status-no-pagada";
                sello.classList.remove('show-stamp');
                lblTotal.textContent = "TOTAL A PAGAR:";
            }

            // Tabla
            const tbody = document.getElementById('tabla-body');
            tbody.innerHTML = "";
            c.servicios.forEach(s => {
                // Solo mostrar servicios con precio, ignorar filas vacías
                if(s.precio !== 0) {
                    tbody.innerHTML += `<tr><td>${s.servicio}</td><td class="text-right">$${s.total.toFixed(2)}</td></tr>`;
                }
            });

            // Totales Numéricos
            document.getElementById('val-subtotal').textContent = "$" + c.totalServicios.toFixed(2);
            document.getElementById('val-mora').textContent = "$" + c.pendienteAnterior.toFixed(2);
            document.getElementById('val-abono').textContent = "-$" + c.abonoTotal.toFixed(2);
            
            // Si está pagado (negativo o cero), mostramos 0.00 o el saldo a favor
            // Si prefiere ver el 0.00 absoluto:
            let displayFinal = c.totalFinalCalculado;
            if(displayFinal < 0) displayFinal = 0; // Opcional: para que no diga $-1.00

            document.getElementById('val-total').textContent = "$" + displayFinal.toFixed(2);
            
            if(isPaid) {
                 document.getElementById('val-total').style.color = "var(--success-green)";
            } else {
                 document.getElementById('val-total').style.color = "var(--danger-red)";
            }
        }

        function copiar() {
            navigator.clipboard.writeText("3113009677");
            alert("Número de cuenta copiado.");
        }
    </script>
</body>
</html>
