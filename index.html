<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Enterprice | Portal de Pagos</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💎</text></svg>">
    
    <style>
        /* === 1. ARQUITECTURA VISUAL (Titanium Dark) === */
        :root {
            --bg-deep: #050505;
            --bg-surface: #10141d;
            --primary: #00f2ff; /* Cian Neón */
            --accent: #4361ee;  /* Azul Eléctrico */
            --success: #00ff9d; /* Verde Matrix */
            --danger: #ff0055;  /* Rojo Alerta */
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --shadow: 0 10px 40px -10px rgba(0,0,0,0.8);
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(at 0% 0%, rgba(67, 97, 238, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 242, 255, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* === 2. CONTENEDOR PRINCIPAL === */
        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 30px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
            animation: slideIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Cabecera */
        header { text-align: center; margin-bottom: 30px; }
        h1 { margin: 0; font-weight: 800; letter-spacing: -1px; background: linear-gradient(to right, #fff, #8b9bb4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .brand-accent { color: var(--primary); -webkit-text-fill-color: var(--primary); }
        .tagline { color: var(--text-muted); font-size: 0.9em; margin-top: 5px; }

        /* === 3. INPUTS Y BOTONES === */
        .search-box { position: relative; margin-bottom: 25px; }
        
        input {
            width: 100%;
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: 16px;
            color: white;
            font-size: 1.1em;
            text-align: center;
            letter-spacing: 1px;
            transition: 0.3s;
        }
        
        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(0, 242, 255, 0.1);
            background: rgba(0, 242, 255, 0.02);
        }

        .btn-action {
            width: 100%;
            padding: 16px;
            background: var(--text-main);
            color: black;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }

        .btn-action:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(255,255,255,0.2); }
        .btn-action:active { transform: scale(0.98); }

        /* Estado de Carga */
        .loader {
            width: 20px; height: 20px; border: 2px solid rgba(0,0,0,0.1);
            border-top-color: #000; border-radius: 50%;
            animation: spin 0.8s linear infinite; display: inline-block; vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* === 4. TARJETA DE RESULTADOS === */
        #result-card { display: none; margin-top: 20px; }
        
        /* Banner de Estado */
        .status-badge {
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.9em;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
        }
        
        .status-paid {
            background: rgba(0, 255, 157, 0.1);
            color: var(--success);
            border: 1px solid rgba(0, 255, 157, 0.2);
        }
        
        .status-pending {
            background: rgba(255, 0, 85, 0.1);
            color: var(--danger);
            border: 1px solid rgba(255, 0, 85, 0.2);
            animation: pulse-border 2s infinite;
        }

        @keyframes pulse-border { 50% { border-color: rgba(255, 0, 85, 0.6); box-shadow: 0 0 15px rgba(255,0,85,0.2); } }

        /* Grid de Fechas */
        .meta-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 25px;
        }
        
        .meta-item {
            background: var(--glass);
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--border);
        }
        
        .meta-label { font-size: 0.65em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; }
        .meta-value { font-weight: 700; font-size: 0.9em; }

        /* Lista de Servicios */
        .invoice-list {
            list-style: none;
            padding: 0;
            margin: 0 0 20px 0;
        }
        
        .invoice-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.95em;
        }
        .invoice-item:last-child { border-bottom: none; }
        .item-price { font-weight: 600; font-feature-settings: "tnum"; }

        /* Sección de Totales */
        .totals-section {
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
        }
        
        .total-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9em; color: var(--text-muted); }
        .total-row.final {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
            color: var(--text-main);
            font-size: 1.2em;
            font-weight: 800;
            align-items: center;
        }

        .price-big { font-size: 1.1em; letter-spacing: -0.5px; }

        /* Banco */
        .bank-details {
            text-align: center;
            border-top: 1px dashed var(--border);
            padding-top: 20px;
        }
        .bank-name { color: var(--text-muted); font-size: 0.8em; margin-bottom: 5px; }
        .bank-number { font-family: monospace; font-size: 1.2em; letter-spacing: 1px; margin-bottom: 15px; display: block; }
        
        .btn-copy {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85em;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-copy:hover { background: rgba(0, 242, 255, 0.1); border-color: var(--primary); }

        /* === 5. SELLO PAGADO (Physics) === */
        .stamp-overlay {
            position: absolute;
            top: 50%; left: 50%;
            width: 280px;
            pointer-events: none;
            z-index: 10;
            opacity: 0;
            transform: translate(-50%, -50%) scale(3) rotate(-15deg);
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); /* Efecto Rebote */
        }
        .stamp-visible { opacity: 0.95; transform: translate(-50%, -50%) scale(1) rotate(-15deg); }

        /* Utilidades */
        .hidden { display: none !important; }
        .error-toast { color: var(--danger); text-align: center; margin-top: 15px; font-size: 0.9em; font-weight: 600; }
        
        /* Animación de Números */
        @property --num {
          syntax: "<number>";
          initial-value: 0;
          inherits: false;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>ENTER<span class="brand-accent">PRICE</span></h1>
            <div class="tagline">Portal de Pagos v1.0 Titanium</div>
        </header>

        <div class="search-section">
            <div class="search-box">
                <input type="text" id="telefono" placeholder="Ingresa tu número..." autocomplete="off" inputmode="numeric">
            </div>
            <button class="btn-action" onclick="consultar()">
                <span id="btn-text">VER ESTADO DE CUENTA</span>
            </button>
            <div id="error-msg" class="error-toast"></div>
        </div>

        <div id="result-card">
            
            <img id="sello-img" src="https://i.imgur.com/K711e1r.png" class="stamp-overlay">

            <div style="text-align: center; margin-bottom: 20px;">
                <div style="font-size: 0.8em; color: var(--text-muted); text-transform: uppercase;">Cliente</div>
                <div id="client-name" style="font-size: 1.5em; font-weight: 700;"></div>
            </div>

            <div id="status-banner" class="status-badge">
                <span id="status-icon">●</span>
                <span id="status-text">PENDIENTE</span>
            </div>

            <div class="meta-grid">
                <div class="meta-item">
                    <div class="meta-label">Corte</div>
                    <div class="meta-value" id="date-cut">--</div>
                </div>
                <div class="meta-item">
                    <div class="meta-label">Límite</div>
                    <div class="meta-value" style="color:var(--primary)" id="date-limit">--</div>
                </div>
                <div class="meta-item">
                    <div class="meta-label">Mora</div>
                    <div class="meta-value" style="color:var(--danger)" id="date-late">--</div>
                </div>
            </div>

            <ul class="invoice-list" id="services-list">
                </ul>

            <div class="totals-section">
                <div class="total-row">
                    <span>Subtotal Servicios</span>
                    <span id="val-subtotal">$0.00</span>
                </div>
                <div class="total-row">
                    <span>Deuda Anterior</span>
                    <span id="val-debt">$0.00</span>
                </div>
                <div class="total-row">
                    <span style="color: var(--success);">(-) Abonos</span>
                    <span style="color: var(--success);" id="val-abono">$0.00</span>
                </div>
                
                <div class="total-row final">
                    <span id="label-total">TOTAL A PAGAR</span>
                    <span class="price-big" id="val-total">$0.00</span>
                </div>
            </div>

            <div class="bank-details">
                <div class="bank-name">CARLOS PANAMEÑO • BANCOAGRÍCOLA</div>
                <span class="bank-number">3113009677</span>
                <button class="btn-copy" onclick="copiar()">
                    Copiar Número
                </button>
            </div>
        </div>
    </div>

    <script>
        // === CONFIGURACIÓN ===
        // ¡PEGUE AQUÍ SU NUEVA URL DEL SCRIPT!
        const API_URL = "https://script.google.com/macros/s/AKfycbyv_Yj9_Z5HfRn6dZ1cb65-CAf4T4ggmoIDmg4iUlz9Sz6tWVfcBszBo9bPnwImOdP-6Q/exec";

        // === LÓGICA DE NEGOCIO ===
        async function consultar() {
            const input = document.getElementById('telefono');
            const btn = document.querySelector('.btn-action');
            const btnText = document.getElementById('btn-text');
            const errorDiv = document.getElementById('error-msg');
            const resultCard = document.getElementById('result-card');
            
            const tel = input.value.trim();

            // Reset UI
            errorDiv.textContent = "";
            resultCard.style.display = 'none';
            document.getElementById('sello-img').classList.remove('stamp-visible');

            if (!tel) {
                mostrarError("Por favor ingresa un número");
                return;
            }

            // Loading State
            btnText.style.display = 'none';
            const loader = document.createElement('span');
            loader.className = 'loader';
            btn.appendChild(loader);
            btn.disabled = true;

            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                const cliente = data[tel];

                if (cliente) {
                    renderizarCliente(cliente);
                } else {
                    mostrarError("No encontramos registro para este número");
                }
            } catch (err) {
                console.error(err);
                mostrarError("Error de conexión. Intenta nuevamente.");
            } finally {
                // Restore State
                btnText.style.display = 'inline';
                if(btn.contains(loader)) btn.removeChild(loader);
                btn.disabled = false;
            }
        }

        function renderizarCliente(c) {
            const card = document.getElementById('result-card');
            card.style.display = 'block';
            
            // Textos Básicos
            document.getElementById('client-name').textContent = c.nombre;
            document.getElementById('date-cut').textContent = formatearFechaCorta(c.fechaCorte);
            document.getElementById('date-limit').textContent = formatearFechaCorta(c.fechaLimite);
            document.getElementById('date-late').textContent = formatearFechaCorta(c.fechaMora);

            // Servicios
            const list = document.getElementById('services-list');
            list.innerHTML = '';
            c.servicios.forEach(s => {
                list.innerHTML += `
                    <li class="invoice-item">
                        <span>${s.servicio}</span>
                        <span class="item-price">$${s.total.toFixed(2)}</span>
                    </li>
                `;
            });

            // Matemáticas
            const subtotal = c.totalServicios;
            const deuda = c.pendienteAnterior;
            const abono = c.abonoTotal;
            let total = c.saldoFinal; // Viene calculado del script

            // Renderizar Totales
            document.getElementById('val-subtotal').textContent = `$${subtotal.toFixed(2)}`;
            document.getElementById('val-debt').textContent = `$${deuda.toFixed(2)}`;
            document.getElementById('val-abono').textContent = `-$${abono.toFixed(2)}`;

            // Lógica de Estado (Pagado/Pendiente)
            const isPaid = c.pagado;
            const banner = document.getElementById('status-banner');
            const statusIcon = document.getElementById('status-icon');
            const statusText = document.getElementById('status-text');
            const labelTotal = document.getElementById('label-total');
            const valTotal = document.getElementById('val-total');
            const sello = document.getElementById('sello-img');

            if (isPaid) {
                // Modo Pagado
                banner.className = "status-badge status-paid";
                statusIcon.textContent = "✔";
                statusText.textContent = "CUENTA AL DÍA";
                labelTotal.textContent = "SALDO A FAVOR";
                
                // Animación de números contando (si hay saldo a favor)
                animarNumero(valTotal, 0, Math.abs(total), 1000);
                valTotal.style.color = "var(--success)";

                // Efecto de Sello
                setTimeout(() => sello.classList.add('stamp-visible'), 300);

            } else {
                // Modo Deuda
                banner.className = "status-badge status-pending";
                statusIcon.textContent = "!";
                statusText.textContent = "PAGO PENDIENTE";
                labelTotal.textContent = "TOTAL A PAGAR";
                
                animarNumero(valTotal, 0, total, 1000);
                valTotal.style.color = "var(--danger)";
                sello.classList.remove('stamp-visible');
            }
        }

        // === UTILIDADES ===
        function mostrarError(msg) {
            const div = document.getElementById('error-msg');
            div.textContent = msg;
            // Pequeña animación de sacudida
            const input = document.getElementById('telefono');
            input.animate([
                { transform: 'translateX(0)' },
                { transform: 'translateX(-10px)' },
                { transform: 'translateX(10px)' },
                { transform: 'translateX(0)' }
            ], { duration: 300 });
        }

        function copiar() {
            navigator.clipboard.writeText("3113009677");
            const btn = document.querySelector('.btn-copy');
            const original = btn.textContent;
            btn.textContent = "¡Copiado!";
            btn.style.borderColor = "var(--success)";
            btn.style.color = "var(--success)";
            setTimeout(() => {
                btn.textContent = original;
                btn.style.borderColor = "var(--border)";
                btn.style.color = "var(--primary)";
            }, 2000);
        }

        function formatearFechaCorta(fechaStr) {
            // Convierte YYYY-MM-DD a DD/MM
            if(!fechaStr) return "--";
            const partes = fechaStr.split('-');
            return `${partes[2]}/${partes[1]}`;
        }

        function animarNumero(elemento, inicio, fin, duracion) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duracion, 1);
                // Easing suave
                const ease = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
                const valorActual = (inicio + (fin - inicio) * ease);
                elemento.textContent = "$" + valorActual.toFixed(2);
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }
        
        // Enter para buscar
        document.getElementById('telefono').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') consultar();
        });

    </script>
</body>
</html>
