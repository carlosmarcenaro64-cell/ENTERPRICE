<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitácora de C/A | Carlos & Alexandra</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="main-header reveal">
    <h1 class="glow-title">BITÁCORA DE C/A</h1>
    <p class="subtitle">Archivo de Aventuras Eternas</p>
</header>

<main class="container">
    <section class="glass-panel filters reveal" style="transition-delay: 0.2s;">
        <div class="filter-row">
            <div class="filter-item">
                <label>📅 Por Fecha</label>
                <input type="date" id="filtroFecha" onchange="window.filtrar()">
            </div>
            <div class="filter-item">
                <label>⭐ Por Promedio</label>
                <select id="filtroEstrellas" onchange="window.filtrar()">
                    <option value="todos">Todos</option>
                    <option value="10">10 Estrellas</option>
                    <option value="9">9 Estrellas</option>
                    <option value="8">8 Estrellas</option>
                </select>
            </div>
            <button class="btn-clean" onclick="location.reload()">Limpiar</button>
        </div>
    </section>

    <section class="glass-panel form-card reveal" style="transition-delay: 0.4s;">
        <div class="form-header">
            <h3 id="formTitle">📝 Registrar Nueva Experiencia</h3>
            <span id="editBadge" class="badge-edit hidden-el">MODO EDICIÓN</span>
        </div>
        
        <input type="hidden" id="editKey">
        
        <div class="form-body">
            <div class="input-row main-select">
                <select id="tipoEntrada" onchange="window.alternarCampos()" class="select-glow">
                    <option value="lugar">📍 Salida / Lugar</option>
                    <option value="cine">🎬 Película / Cine</option>
                </select>
            </div>

            <div class="input-grid">
                <div class="input-group">
                    <input type="text" id="nombre" placeholder=" " required>
                    <label>Nombre del lugar o película</label>
                </div>
                <div class="input-group">
                    <input type="text" id="foto" placeholder=" " required>
                    <label>URL de la imagen</label>
                </div>
                <div class="input-group">
                    <input type="date" id="fecha" required>
                    <label class="static-label">Fecha</label>
                </div>
            </div>

            <div id="camposLugar" class="dynamic-section">
                <div class="input-grid-2">
                    <div class="input-group">
                        <input type="number" id="califCarlosL" min="1" max="10" placeholder=" ">
                        <label>Rating Carlos (1-10)</label>
                    </div>
                    <div class="input-group">
                        <input type="number" id="califAlexandraL" min="1" max="10" placeholder=" ">
                        <label>Rating Alexandra (1-10)</label>
                    </div>
                </div>
                <div class="textarea-grid">
                    <textarea id="divertido" placeholder="Lo más divertido..."></textarea>
                    <textarea id="aburrido" placeholder="Lo más aburrido..."></textarea>
                </div>
            </div>

            <div id="camposCine" class="dynamic-section hidden-el">
                <div class="input-grid-2">
                    <div class="input-group">
                        <input type="number" id="califCarlosC" min="1" max="10" placeholder=" ">
                        <label>Rating Carlos (1-10)</label>
                    </div>
                    <div class="input-group">
                        <input type="number" id="califAlexandraC" min="1" max="10" placeholder=" ">
                        <label>Rating Alexandra (1-10)</label>
                    </div>
                </div>
                <div class="input-row" style="margin-top: 20px;">
                    <select id="generoCine" class="select-glow">
                        <option value="">🎬 Seleccionar Género</option>
                        <option value="Acción">Acción</option>
                        <option value="Comedia">Comedia</option>
                        <option value="Terror">Terror</option>
                        <option value="Romance">Romance</option>
                        <option value="Animación">Animación</option>
                        <option value="Drama">Drama</option>
                    </select>
                </div>
                <div class="textarea-grid">
                    <textarea id="gustoCine" placeholder="Lo que más nos gustó..."></textarea>
                    <textarea id="noGustoCine" placeholder="Lo que no nos gustó..."></textarea>
                </div>
            </div>

            <div class="form-footer">
                <button class="btn-save" id="btnGuardar">Guardar Memoria</button>
                <button class="btn-cancel hidden-el" onclick="window.cancelarEdicion()">Cancelar</button>
            </div>
        </div>
    </section>

    <div class="grid-display" id="contenedorPrincipal"></div>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDgc_fOFDZZTcBe2mtD0uGpgcFl4f34oPI",
        authDomain: "bitacora-ca.firebaseapp.com",
        projectId: "bitacora-ca",
        storageBucket: "bitacora-ca.firebasestorage.app",
        messagingSenderId: "707668977849",
        appId: "1:707668977849:web:5e72c6eb55fcdfb4dad368",
        databaseURL: "https://bitacora-ca-default-rtdb.firebaseio.com/"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const aventurasRef = ref(db, 'aventuras');

    window.alternarCampos = () => {
        const t = document.getElementById('tipoEntrada').value;
        document.getElementById('camposLugar').classList.toggle('hidden-el', t !== 'lugar');
        document.getElementById('camposCine').classList.toggle('hidden-el', t !== 'cine');
    };

    document.getElementById('btnGuardar').onclick = () => {
        const key = document.getElementById('editKey').value;
        const tipo = document.getElementById('tipoEntrada').value;
        
        const c1 = parseFloat(tipo === 'lugar' ? document.getElementById('califCarlosL').value : document.getElementById('califCarlosC').value) || 0;
        const c2 = parseFloat(tipo === 'lugar' ? document.getElementById('califAlexandraL').value : document.getElementById('califAlexandraC').value) || 0;
        const promedio = ((c1 + c2) / 2).toFixed(1);

        const data = {
            tipo,
            nombre: document.getElementById('nombre').value,
            foto: document.getElementById('foto').value,
            fecha: document.getElementById('fecha').value,
            califCarlos: c1,
            califAlexandra: c2,
            rating: promedio,
            genero: tipo === 'cine' ? document.getElementById('generoCine').value : "",
            divertido: document.getElementById('divertido').value || "",
            aburrido: document.getElementById('aburrido').value || "",
            gusto: document.getElementById('gustoCine').value || "",
            noGusto: document.getElementById('noGustoCine').value || ""
        };

        if(key) {
            update(ref(db, `aventuras/${key}`), data).then(() => location.reload());
        } else {
            push(aventurasRef, data).then(() => location.reload());
        }
    };

    onValue(aventurasRef, (snap) => {
        window.raw = snap.val();
        window.render(window.raw);
    });

    window.render = (data) => {
        const cont = document.getElementById('contenedorPrincipal');
        cont.innerHTML = '';
        if(!data) return;
        Object.keys(data).reverse().forEach((id, index) => {
            const e = data[id];
            cont.innerHTML += `
                <div class="card reveal" style="transition-delay: ${index * 0.1}s">
                    <img src="${e.foto}" class="card-img">
                    <div class="card-info">
                        <div class="tag-row">
                            <span class="tag ${e.tipo}">${e.tipo}</span>
                            ${e.genero ? `<span class="tag-gen">${e.genero}</span>` : ''}
                        </div>
                        <h3>${e.nombre}</h3>
                        <div class="scores">
                            <span>🧔 Carlos: ${e.califCarlos}</span>
                            <span>👩 Alexandra: ${e.califAlexandra}</span>
                            <div class="final-avg">⭐ Promedio: ${e.rating}</div>
                        </div>
                        <p class="card-date">📅 ${e.fecha}</p>
                        <div class="card-actions">
                            <button class="edit-btn" onclick="prepararEdicion('${id}')">Editar</button>
                            <button class="del-btn" onclick="borrar('${id}')">Borrar</button>
                        </div>
                    </div>
                </div>`;
        });
    };

    window.prepararEdicion = (id) => {
        const e = window.raw[id];
        document.getElementById('editKey').value = id;
        document.getElementById('tipoEntrada').value = e.tipo;
        document.getElementById('nombre').value = e.nombre;
        document.getElementById('foto').value = e.foto;
        document.getElementById('fecha').value = e.fecha;
        if(e.tipo === 'lugar') {
            document.getElementById('califCarlosL').value = e.califCarlos;
            document.getElementById('califAlexandraL').value = e.califAlexandra;
            document.getElementById('divertido').value = e.divertido;
            document.getElementById('aburrido').value = e.aburrido;
        } else {
            document.getElementById('califCarlosC').value = e.califCarlos;
            document.getElementById('califAlexandraC').value = e.califAlexandra;
            document.getElementById('generoCine').value = e.genero;
            document.getElementById('gustoCine').value = e.gusto;
            document.getElementById('noGustoCine').value = e.noGusto;
        }
        window.alternarCampos();
        document.getElementById('formTitle').innerText = "✏️ Editando...";
        document.getElementById('btnGuardar').innerText = "Actualizar";
        document.getElementById('editBadge').classList.remove('hidden-el');
        window.scrollTo({top: 0, behavior: 'smooth'});
    };

    window.borrar = (id) => confirm("¿Borrar recuerdo?") && remove(ref(db, `aventuras/${id}`));
    window.cancelarEdicion = () => location.reload();
</script>
</body>
</html>
