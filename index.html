<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Recibos Enterprice Moderna</title>
    <link rel="stylesheet" href="diseño.css"> 
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧾</text></svg>">
</head>
<body>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="container animate-pop-in">
        <h1>Consulta tu Recibo <span class="neon-text">Enterprice</span></h1>
        <p class="subtitle">Ingresa tu número de teléfono para ver tu detalle.</p>

        <div class="input-group">
            <label for="numero-telefono">Número de Teléfono</label>
            <input type="text" id="numero-telefono" placeholder="Ej: 98765432" autocomplete="off">
             <span class="input-highlight"></span>
        </div>
        
        <button id="buscar-recibo" class="btn-neon">
            <span>Buscar Recibo</span>
            <div class="btn-particles"></div>
        </button>

        <div id="detalle-recibo" class="glass-panel">
            <div id="mensaje-estado-container">
                 <p id="mensaje-estado">Ingresa un número para buscar.</p>
            </div>
        </div>
    </div>

    <script>
        // ==========================================================
        // DATOS ESTÁTICOS PARA DEMOSTRACIÓN (Como en tu versión anterior)
        // ==========================================================
        const datosDeRecibos = {
            "78991675": { "nombre": "César", "servicios": [{ "servicio": "Spotify Family", "precio": 4.00, "cantidad": 2, "total": 8.00 }, { "servicio": "YouTube Premium", "precio": 4.25, "cantidad": 1, "total": 4.25 }, { "servicio": "App Mantenimiento", "precio": 3.51, "cantidad": 1, "total": 3.51 }], "totalServicios": 15.76, "pendienteAnterior": 0.00, "fechaEmision": "2025-11-20" },
            "73179224": { "nombre": "Daisy", "servicios": [{ "servicio": "YouTube Premium", "precio": 4.25, "cantidad": 1, "total": 4.25 }], "totalServicios": 4.25, "pendienteAnterior": 4.00, "fechaEmision": "2025-11-20" },
            "76470201": { "nombre": "Adriana", "servicios": [{ "servicio": "YouTube Premium", "precio": 4.25, "cantidad": 3, "total": 12.75 }], "totalServicios": 12.75, "pendienteAnterior": 5.00, "fechaEmision": "2025-11-20" },
            "98765432": { "nombre": "Invitado Demo", "servicios": [{ "servicio": "Plan Demo Básico", "precio": 10.00, "cantidad": 1, "total": 10.00 }], "totalServicios": 10.00, "pendienteAnterior": 0.00, "fechaEmision": "2025-11-20" }
        };
        // ==========================================================
        
        const inputTelefono = document.getElementById('numero-telefono');
        const btnBuscar = document.getElementById('buscar-recibo');
        const detalleReciboDiv = document.getElementById('detalle-recibo');
        const mensajeEstado = document.getElementById('mensaje-estado');
        const mensajeContainer = document.getElementById('mensaje-estado-container');

        btnBuscar.addEventListener('click', buscarRecibo);
        inputTelefono.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') buscarRecibo();
        });

        function mostrarMensaje(mensaje, tipo) {
            // Limpiamos resultados anteriores si existen
            const existingResult = detalleReciboDiv.querySelector('.result-content');
            if (existingResult) existingResult.remove();
            
            mensajeContainer.style.display = 'flex'; // Aseguramos que se vea el contenedor de mensajes
            mensajeEstado.className = `message ${tipo}-message fade-in`;
            mensajeEstado.innerHTML = mensaje; // Usamos innerHTML por si insertamos el spinner
        }

        function buscarRecibo() {
            const telefono = inputTelefono.value.trim();
            inputTelefono.classList.remove('input-error', 'input-success');
            detalleReciboDiv.classList.remove('shake-animation');

            if (!telefono) {
                inputTelefono.classList.add('input-error');
                mostrarMensaje('Por favor, ingresa un número de teléfono.', 'error');
                detalleReciboDiv.classList.add('shake-animation');
                return;
            }

            // Estado de Carga Moderno
            btnBuscar.classList.add('loading-btn');
            btnBuscar.disabled = true;
            mostrarMensaje('<div class="spinner"></div> Buscando en la red...', 'loading');

            // Simulación de carga (setTimeout)
            setTimeout(() => {
                btnBuscar.classList.remove('loading-btn');
                btnBuscar.disabled = false;
                
                const data = datosDeRecibos[telefono];

                if (data) {
                    inputTelefono.classList.add('input-success');
                    renderizarRecibo(data);
                } else {
                    inputTelefono.classList.add('input-error');
                    mostrarMensaje(`No se encontró un recibo asociado al número <strong>${telefono}</strong>.`, 'error');
                    detalleReciboDiv.classList.add('shake-animation');
                }
            }, 800); // Un poco más de tiempo para apreciar la animación de carga
        }

        function renderizarRecibo(data) {
            mensajeContainer.style.display = 'none'; // Ocultamos el contenedor de mensajes

            const totalServicios = data.totalServicios; 
            const pendienteAnterior = data.pendienteAnterior;
            const totalFinal = totalServicios + pendienteAnterior;
            const esDeudor = totalFinal > 0;

            // Creamos un nuevo contenedor para el resultado con animación de entrada
            let html = `
            <div class="result-content slide-up-fade-in">
                <div class="recibo-header">
                    <div>
                        <p class="client-label">Cliente</p>
                        <p class="client-name">${data.nombre}</p>
                    </div>
                    <div style="text-align: right;">
                         <p class="client-label">Emisión</p>
                        <p class="invoice-date">${data.fechaEmision}</p>
                    </div>
                </div>
                
                <h3 class="neon-subtitle">Detalle de Servicios</h3>
                <div class="table-responsive">
                    <table class="recibo-table">
                        <thead>
                            <tr>
                                <th>Servicio</th>
                                <th>Precio</th>
                                <th>Cant.</th>
                                <th>Total</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            data.servicios.forEach((item, index) => {
                // Añadimos un pequeño retraso escalonado a cada fila para un efecto visual atractivo
                html += `
                    <tr style="animation-delay: ${index * 0.1}s" class="staggered-row">
                        <td class="col-servicio">${item.servicio}</td>
                        <td>$${item.precio.toFixed(2)}</td>
                        <td>${item.cantidad}</td>
                        <td class="col-total">$${item.total.toFixed(2)}</td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                        <tfoot>
                             <tr class="summary-row">
                                <td colspan="3" class="text-right label-muted">Subtotal Servicios:</td>
                                <td class="text-highlight">$${data.totalServicios.toFixed(2)}</td>
                            </tr>
                             <tr class="summary-row">
                                <td colspan="3" class="text-right label-muted">Pendiente Anterior:</td>
                                <td>$${pendienteAnterior.toFixed(2)}</td>
                            </tr>
                            <tr class="total-final-row ${esDeudor ? 'estado-deuda' : 'estado-pagado'}">
                                <td colspan="3" class="text-right total-label">TOTAL A PAGAR:</td>
                                <td class="total-amount">$${totalFinal.toFixed(2)}</td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
            `;

            // Insertamos el HTML en el div principal de detalle
            detalleReciboDiv.innerHTML = html;
            // Volvemos a añadir el contenedor de mensajes al final por si se necesita después
            detalleReciboDiv.appendChild(mensajeContainer); 
        }
    </script>
</body>
</html>
