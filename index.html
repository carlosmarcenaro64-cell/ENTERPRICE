<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102b4e" />
    <meta name="description" content="ENTERPRICE - Control de cuotas, recibos y pagos." />
    <title>ENTERPRICE | Recibos y cuotas</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand"><span class="brand-mark">E</span><span>ENTERPRICE</span></div>
        <span class="top-caption">Control de cuotas y recibos</span>
      </header>
      <main class="shell">
        <section class="hero">
          <p class="eyebrow">PORTAL DE CLIENTES Y ADMINISTRACIÓN</p>
          <h1>Todo tu control de cuotas,<br><span>en un solo lugar.</span></h1>
          <p class="intro">Consulta recibos, revisa saldos y reporta tus pagos de forma sencilla y segura.</p>
          <button id="google-login" class="primary-btn">Continuar con Google</button>
          <p id="auth-message" class="message" role="status">Inicia sesión para continuar.</p>
        </section>
        <section id="account-panel" class="panel hidden" aria-live="polite">
          <div class="panel-head">
            <div><p class="eyebrow">SESIÓN ACTIVA</p><h2 id="welcome">Bienvenido</h2></div>
            <button id="logout" class="secondary-btn">Cerrar sesión</button>
          </div>
          <div id="role-content"></div>
        </section>
        <footer>ENTERPRICE · USD · Cuotas mensuales</footer>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
