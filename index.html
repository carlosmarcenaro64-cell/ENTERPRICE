<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Recibos Enterprice</title>
    <link rel="stylesheet" href="diseño.css"> 
</head>
<body>
    <div class="container">
        <h1>Consulta tu Recibo <span style="color: #64dded;">Enterprice</span></h1>
        <p class="subtitle">Ingresa tu número de teléfono para ver tu detalle.</p>

        <label for="numero-telefono">Número de Teléfono (Ej: 98765432):</label>
        <input type="text" id="numero-telefono" placeholder="Ej: 98765432">
        
        <button id="buscar-recibo">Buscar Recibo</button>

        <div id="detalle-recibo">
            <h2>Detalle del Recibo:</h2>
            <p id="mensaje-estado">Ingresa un número para buscar.</p>
        </div>
    </div>

    <script>
        const URL_GOOGLE_API = "https://script.google.com/macros/s/AKfycbychtDezOXT2Dzp8Jn-mLf4juQHJ-b58TTd0RQp3WAK5U8wdL6BNOdGrf46vAYqZ9KZ/exec";

        const datosDeRecibos = {
            "78991675": {
                "nombre": "César",
                "servicios": [
                    { "servicio": "spotify", "precio": 4.00, "cantidad": 2, "total": 8.00 },
                    { "servicio": "youtube", "precio": 4.25, "cantidad": 1, "total": 4.25 },
                    { "servicio": "app", "precio": 3.51, "cantidad": 1, "total": 3.51 }
                ],
                "totalServicios": 15.76, 
                "pendienteAnterior": 0.00,
                "fechaEmision": "2025-11-20"
            },
            "73179224": {
                "nombre": "Daisy",
                "servicios": [
                    { "servicio": "youtube", "precio": 4.25, "cantidad": 1, "total": 4.25 }
                ],
                "totalServicios": 4.25, 
                "pendienteAnterior": 4.00,
                "fechaEmision": "2025-11-20"
            },
            "76470201": {
                "nombre": "Adriana",
                "servicios": [
                    { "servicio": "youtube", "precio": 4.25, "cantidad": 3, "total": 12.75 }
                ],
                "totalServicios": 12.75,
                "pendienteAnterior": 5.00,
                "fechaEmision": "2025-11-20"
            },
            "98765432": { // Número de ejemplo
                "nombre": "Invitado",
                "servicios": [
                    { "servicio": "Demo", "precio": 10.00, "cantidad": 1, "total": 10.00 }
                ],
                "totalServicios": 10.00, 
                "pendienteAnterior": 0.00,
                "fechaEmision": "2025-11-20"
            }
        };
        // ==========================================================
        
        const inputTelefono = document.getElementById('numero-telefono');
        const btnBuscar = document.getElementById('buscar-recibo');
        const detalleReciboDiv = document.getElementById('detalle-recibo');
        const mensajeEstado = document.getElementById('mensaje-estado');

        btnBuscar.addEventListener('click', buscarRecibo);
        inputTelefono.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                buscarRecibo();
            }
        });

        function mostrarMensaje(mensaje, tipo) {
            mensajeEstado.className = `message ${tipo}-message`;
            mensajeEstado.textContent = mensaje;
            detalleReciboDiv.querySelector('table')?.remove(); 
        }

        function buscarRecibo() {
            const telefono = inputTelefono.value.trim();
            detalleReciboDiv.classList.remove('shake-animation', 'success-animation');

            if (!telefono) {
                mostrarMensaje('Por favor, ingresa un número de teléfono.', 'error');
                detalleReciboDiv.classList.add('shake-animation');
                return;
            }

            // Muestra pantalla de carga
            mensajeEstado.className = 'message loading'; 
            mensajeEstado.textContent = 'Buscando el número...'; 

            // Simulación de carga (espera breve)
            setTimeout(() => {
                const data = datosDeRecibos[telefono];

                if (data) {
                    inputTelefono.classList.add('success-animation');
                    renderizarRecibo(data);
                    detalleReciboDiv.classList.add('success-animation');

                } else {
                    inputTelefono.classList.add('shake-animation');
                    mostrarMensaje(`No se encontró un recibo para el número ${telefono}.`, 'error');
                    detalleReciboDiv.classList.add('shake-animation');
                }
            }, 500);
        }

        function renderizarRecibo(data) {
            const totalServicios = data.totalServicios; 
            const pendienteAnterior = data.pendienteAnterior;
            const totalFinal = totalServicios + pendienteAnterior;

            let html = `
                <p style="margin-bottom: 5px;"><strong>Cliente:</strong> ${data.nombre}</p>
                <p style="margin-bottom: 15px;"><strong>Fecha de Emisión:</strong> ${data.fechaEmision}</p>
                
                <h3 style="color: #64dded; margin-top: 10px;">Detalle de Servicios</h3>
                <table class="recibo-table">
                    <thead>
                        <tr>
                            <th>Servicio</th>
                            <th>Precio</th>
                            <th>Cant.</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            data.servicios.forEach(item => {
                html += `
                    <tr>
                        <td>${item.servicio}</td>
                        <td>$${item.precio.toFixed(2)}</td>
                        <td>${item.cantidad}</td>
                        <td>$${item.total.toFixed(2)}</td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                    <tfoot>
                        <tr class="pendiente-anterior-row">
                            <td colspan="3" style="text-align: right;">PENDIENTE ANTERIOR:</td>
                            <td>$${pendienteAnterior.toFixed(2)}</td>
                        </tr>
                        <tr class="total-row">
                            <td colspan="3" style="text-align: right;">TOTAL SERVICIOS DEL MES:</td>
                            <td>$${data.totalServicios.toFixed(2)}</td>
                        </tr>
                        <tr class="total-row final-pendiente-row">
                            <td colspan="3" style="text-align: right;">TOTAL PENDIENTE A PAGAR:</td>
                            <td>$${totalFinal.toFixed(2)}</td>
                        </tr>
                    </tfoot>
                </table>
            `;

            mensajeEstado.innerHTML = html;
        }

    </script>
</body>
</html>
