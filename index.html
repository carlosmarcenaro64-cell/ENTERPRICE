<body class="bg-gradient-to-br from-indigo-950 via-purple-950 to-slate-950 min-h-screen text-white flex flex-col justify-between items-center p-3 select-none overflow-x-hidden">

    <header class="w-full max-w-md flex flex-col gap-2 py-2">

        <div class="text-center mt-1">

                <button data-key="O" class="key-btn flex-1 bg-white/25 hover:bg-white/35 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md">O</button>

                <button data-key="X" class="key-btn flex-1 bg-white/25 hover:bg-white/35 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md">X</button>
                <button data-key="C" class="key-btn flex-1 bg-white/25 hover:bg-white/35 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md">C</button>
                <button data-key="V" class="key-btn flex-1 bg-white/25 hover:bg-white/35 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md">V</button>
                <button data-key="B" class="key-btn flex-1 bg-white/25 hover:bg-white/35 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md">B</button>
                <button data-key="N" class="key-btn flex-1 bg-white/25 hover:bg-white/35 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md">N</button>

            <input type="text" id="username-input" placeholder="Tu apodo..." maxlength="15" class="w-full bg-white/10 border border-white/20 rounded-xl px-3 py-2 text-xs text-white text-center font-bold mb-4 focus:outline-none focus:border-indigo-400">
            <button id="save-profile-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-xs transition-all shadow-lg">Guardar</button>

    <div id="stats-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-300">
        <div class="bg-slate-900 border border-white/20 rounded-2xl w-full max-w-sm p-6 text-center shadow-2xl relative transform scale-90 transition-all duration-300">
            <button id="close-stats-btn" class="absolute top-3 right-3 text-slate-400 hover:text-white p-1 text-lg font-bold">✕</button>
            <h2 class="text-xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-pink-400 mb-1">Estadísticas</h2>
            <p id="stats-user-label" class="text-xs text-indigo-300 mb-5">Modo Local</p>
            <div class="grid grid-cols-2 gap-3 mb-6">
                <div class="bg-white/5 border border-white/10 p-3 rounded-xl flex flex-col items-center">
                    <span id="stat-won" class="text-2xl font-black text-emerald-400">0</span>
                    <span class="text-[11px] text-slate-300">Acertadas</span>
                </div>
                <div class="bg-white/5 border border-white/10 p-3 rounded-xl flex flex-col items-center">
                    <span id="stat-lost" class="text-2xl font-black text-rose-400">0</span>
                    <span class="text-[11px] text-slate-300">Falladas</span>
                </div>
                <div class="bg-white/5 border border-white/10 p-3 rounded-xl flex flex-col items-center">
                    <span id="stat-played" class="text-2xl font-black text-indigo-300">0</span>
                    <span class="text-[11px] text-slate-300">Jugadas</span>
                </div>
                <div class="bg-white/5 border border-white/10 p-3 rounded-xl flex flex-col items-center">
                    <span id="stat-winrate" class="text-2xl font-black text-amber-300">0%</span>
                    <span class="text-[11px] text-slate-300">% Victoria</span>
                </div>
            </div>
            <div class="bg-indigo-950/60 border border-indigo-500/30 p-3 rounded-xl flex justify-between items-center mb-4">
                <span class="text-xs text-indigo-200">🔥 Racha Actual:</span>
                <span id="stat-streak" class="text-base font-bold text-yellow-400">0</span>
            </div>
            <button id="modal-close-action" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-xs transition-all">Cerrar</button>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.style.opacity = '0';
                    setTimeout(() => splash.remove(), 500);
                }
            }, 300);
        });

        const expandedDictionary = [
            "SOL|Astro|Astro diurno", "PAN|Alimento|Masa de harina", "LUZ|Claridad|Radiación visible",
            "MAR|Agua|Masa de agua salada", "REY|Monarca|Soberano de un reino", "VOZ|Sonido|Cuerdas vocales",
            "ORO|Metal|Metal precioso", "RIO|Cauce|Corriente natural", "PAZ|Tranquilidad|Armonía",
            "CASA|Vivienda|Hogar familiar", "LUNA|Satélite|Satélite natural", "AGUA|Líquido|Vital para la vida",
            "ROSA|Flor|Flor con espinas", "CAFE|Bebida|Estimulante oscuro", "LEON|Animal|Rey de la selva",
            "PERRO|Animal|El mejor amigo", "PLAYA|Costa|Arena y mar", "LIBRO|Objeto|Lectura y hojas",
            "FUTBOL|Deporte|Deporte de balón", "PIANO|Instrumento|Teclas musicales", "TIGRE|Animal|Felino rayado",
            "ARBOL|Planta|Tronco y ramas", "RELOJ|Objeto|Mide el tiempo", "MAGIA|Arte|Ilusionismo"
        ];

        const dictionary = expandedDictionary.map(item => {
            const parts = item.split('|');
            return { word: parts[0].toUpperCase(), hint: parts[1] || 'Pista', long: parts[2] || 'Descripción' };
        });

        let userProfileName = localStorage.getItem('word_username') || "Invitado";
        let WORD = "", CLUE = "", LONG_DESC = "", WORD_LENGTH = 3, MAX_ATTEMPTS = 6, currentAttempt = 0, currentGuess = [], isGameOver = false;
        let soundEnabled = localStorage.getItem('word_sound') !== 'false';
        let stats = JSON.parse(localStorage.getItem('word_stats')) || { won: 0, lost: 0, played: 0, streak: 0 };
        let isDailyMode = false, currentThemeIndex = 0;
        const themes = [
            { bg: "from-indigo-950 via-purple-950 to-slate-950", name: "Cósmico" },
            { bg: "from-emerald-950 via-teal-950 to-slate-950", name: "Esmeralda" },
            { bg: "from-rose-950 via-red-950 to-slate-950", name: "Rubí" }
        ];

        document.getElementById('total-words-count').textContent = dictionary.length;
        document.getElementById('user-name').textContent = userProfileName;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (!soundEnabled) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if (type === 'key') {
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
                osc.start(); osc.stop(audioCtx.currentTime + 0.08);
            } else if (type === 'win') {
                [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
                    setTimeout(() => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g); g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(freq, audioCtx.currentTime);
                        g.gain.setValueAtTime(0.12, audioCtx.currentTime);
                        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                        o.start(); o.stop(audioCtx.currentTime + 0.3);
                    }, idx * 100);
                });
            } else if (type === 'fail') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        function initGame(daily = false) {
            isDailyMode = daily;
            if (daily) {
                const todayStr = new Date().toISOString().slice(0, 10);
                let seed = 0; for(let c of todayStr) seed += c.charCodeAt(0);
                const wordData = dictionary[seed % dictionary.length];
                WORD = wordData.word; CLUE = wordData.hint; LONG_DESC = wordData.long;
            } else {
                const wordData = dictionary[Math.floor(Math.random() * dictionary.length)];
                WORD = wordData.word; CLUE = wordData.hint; LONG_DESC = wordData.long;
            }
            WORD_LENGTH = WORD.length;
            document.getElementById('word-length-count').textContent = WORD_LENGTH;
            if (WORD_LENGTH >= 6 && !isDailyMode) document.getElementById('skip-btn').classList.remove('hidden');
            else document.getElementById('skip-btn').classList.add('hidden');

            currentAttempt = 0; currentGuess = []; isGameOver = false;
            document.getElementById('restart-btn').classList.add('hidden');
            document.getElementById('share-btn').parentElement.classList.add('hidden');
            document.getElementById('hint-box').classList.add('opacity-0', 'scale-95', 'pointer-events-none', 'hidden');
            renderBoard();
        }

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            for (let i = 0; i < MAX_ATTEMPTS; i++) {
                const row = document.createElement('div');
                row.className = 'flex gap-1.5 justify-center';
                for (let j = 0; j < WORD_LENGTH; j++) {
                    const tile = document.createElement('div');
                    tile.className = 'w-11 h-11 md:w-13 md:h-13 border-2 rounded-xl flex items-center justify-center text-lg md:text-xl font-extrabold tile-empty transition-all duration-300 shadow-inner';
                    tile.id = `tile-${i}-${j}`;
                    row.appendChild(tile);
                }
                boardEl.appendChild(row);
            }
        }

        function handleKeyPress(key) {
            if (isGameOver) return;
            playSound('key');
            if (key === 'ENTER') {
                if (currentGuess.length < WORD_LENGTH) { showMessage("Faltan letras"); playSound('fail'); return; }
                const guessWord = currentGuess.join('');
                let letterCount = {};
                for (let char of WORD) letterCount[char] = (letterCount[char] || 0) + 1;
                const statuses = Array(WORD_LENGTH).fill('absent');

                for (let i = 0; i < WORD_LENGTH; i++) {
                    if (guessWord[i] === WORD[i]) { statuses[i] = 'correct'; letterCount[guessWord[i]]--; }
                }
                for (let i = 0; i < WORD_LENGTH; i++) {
                    if (statuses[i] !== 'correct' && letterCount[guessWord[i]] > 0) {
                        statuses[i] = 'present'; letterCount[guessWord[i]]--;
                    }
                }

                for (let i = 0; i < WORD_LENGTH; i++) {
                    const tile = document.getElementById(`tile-${currentAttempt}-${i}`);
                    setTimeout(() => {
                        tile.classList.add('flip-tile');
                        if (statuses[i] === 'correct') tile.classList.add('tile-correct');
                        else if (statuses[i] === 'present') tile.classList.add('tile-present');
                        else tile.classList.add('tile-absent');
                    }, i * 150);
                }

                setTimeout(() => {
                    if (guessWord === WORD) {
                        playSound('win'); endGame(true);
                    } else {
                        currentAttempt++; currentGuess = [];
                        
                        // Pista corta en el 5º intento (índice 4)
                        if (currentAttempt === 4) {
                            document.getElementById('clue-text').textContent = `Pista: ${CLUE}`;
                            document.getElementById('hint-box').classList.remove('hidden', 'opacity-0', 'scale-95', 'pointer-events-none');
                        }
                        // Pista larga (definición) en el 6º y último intento (índice 5)
                        else if (currentAttempt === 5) {
                            document.getElementById('clue-text').textContent = `Definición: ${LONG_DESC}`;
                            document.getElementById('hint-box').classList.remove('hidden', 'opacity-0', 'scale-95', 'pointer-events-none');
                        }

                        if (currentAttempt >= MAX_ATTEMPTS) { playSound('fail'); endGame(false); }
                    }
                }, WORD_LENGTH * 150 + 50);

            } else if (key === 'BACK') {
                if (currentGuess.length > 0) { currentGuess.pop(); updateRow(); }
            } else {
                if (currentGuess.length < WORD_LENGTH) { currentGuess.push(key.toUpperCase()); updateRow(); }
            }
        }

        function updateRow() {
            for (let j = 0; j < WORD_LENGTH; j++) {
                const tile = document.getElementById(`tile-${currentAttempt}-${j}`);
                tile.textContent = j < currentGuess.length ? currentGuess[j] : '';
            }
        }

        function endGame(won) {
            isGameOver = true; stats.played++;
            if (won) { stats.won++; stats.streak++; showMessage("¡Adivinaste la palabra!"); }
            else { stats.lost++; stats.streak = 0; showMessage(`Era: ${WORD}`); }
            localStorage.setItem('word_stats', JSON.stringify(stats));
            document.getElementById('restart-btn').classList.remove('hidden');
            document.getElementById('share-btn').parentElement.classList.remove('hidden');
        }

        function showMessage(text) {
            const msg = document.getElementById('game-message');
            msg.textContent = text; msg.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => msg.classList.add('opacity-0', 'pointer-events-none'), 3000);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleKeyPress('ENTER');
            else if (e.key === 'Backspace') handleKeyPress('BACK');
            else if (/^[a-zA-ZñÑ]$/.test(e.key)) handleKeyPress(e.key.toUpperCase());
        });

        document.getElementById('keyboard').addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (btn && btn.getAttribute('data-key')) handleKeyPress(btn.getAttribute('data-key'));
        });

        document.getElementById('restart-btn').addEventListener('click', () => initGame(false));
        document.getElementById('skip-btn').addEventListener('click', () => initGame(false));
        document.getElementById('daily-btn').addEventListener('click', () => initGame(true));

        document.getElementById('sound-btn').addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            localStorage.setItem('word_sound', soundEnabled);
            document.getElementById('sound-btn').textContent = soundEnabled ? '🔊' : '🔇';
        });

        document.getElementById('theme-btn').addEventListener('click', () => {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            document.body.className = `bg-gradient-to-br ${themes[currentThemeIndex].bg} min-h-screen text-white flex flex-col justify-between items-center p-3 select-none overflow-x-hidden`;
        });

        const statsModal = document.getElementById('stats-modal');
        const profileModal = document.getElementById('profile-modal');

        document.getElementById('stats-btn').addEventListener('click', () => {
            document.getElementById('stat-won').textContent = stats.won;
            document.getElementById('stat-lost').textContent = stats.lost;
            document.getElementById('stat-played').textContent = stats.played;
            document.getElementById('stat-winrate').textContent = stats.played ? Math.round((stats.won/stats.played)*100) + '%' : '0%';
            document.getElementById('stat-streak').textContent = stats.streak;
            statsModal.classList.remove('opacity-0', 'pointer-events-none');
        });
        document.getElementById('close-stats-btn').addEventListener('click', () => statsModal.classList.add('opacity-0', 'pointer-events-none'));
        document.getElementById('modal-close-action').addEventListener('click', () => statsModal.classList.add('opacity-0', 'pointer-events-none'));

        document.getElementById('user-profile').addEventListener('click', () => {
            document.getElementById('username-input').value = userProfileName;
            profileModal.classList.remove('opacity-0', 'pointer-events-none');
        });
        document.getElementById('close-profile-btn').addEventListener('click', () => profileModal.classList.add('opacity-0', 'pointer-events-none'));
        document.getElementById('save-profile-btn').addEventListener('click', () => {
            const newName = document.getElementById('username-input').value.trim();
            if (newName) {
                userProfileName = newName;
                localStorage.setItem('word_username', userProfileName);
                document.getElementById('user-name').textContent = userProfileName;
                profileModal.classList.add('opacity-0', 'pointer-events-none');
            }
        });

        initGame(false);
    </script>
</body>
</html>
